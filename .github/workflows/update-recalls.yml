name: Update FDA recall data

on:
  schedule:
    # Daily refresh; openFDA itself is updated weekly.
    - cron: '17 14 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Refresh FDA recall snapshot
        run: python tools/update_recalls.py

      - name: Commit changes if the snapshot changed
        shell: bash
        run: |
          if git diff --quiet -- data/recalls.json data/recalls.js; then
            echo "Recall snapshot unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/recalls.json data/recalls.js
          git commit -m "Update FDA recall snapshot"
          git push
